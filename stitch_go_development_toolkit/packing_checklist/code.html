<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Packing Checklist - Warm Pantry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "card-surface": "#FEFBF6",
                        "outline-variant": "#dcc1b9",
                        "surface-dim": "#e5d7d1",
                        "secondary-container": "#c7efa4",
                        "outline": "#89726c",
                        "text-muted": "#6B6259",
                        "secondary-fixed": "#c7efa4",
                        "cat-grain": "#C9A227",
                        "on-tertiary-container": "#110100",
                        "background": "#fff8f5",
                        "surface-container-high": "#f3e5df",
                        "on-primary-fixed": "#3a0a00",
                        "cat-unknown": "#8A8880",
                        "inverse-primary": "#ffb59f",
                        "primary": "#9c4226",
                        "tertiary": "#99452b",
                        "surface-container-low": "#fff1ea",
                        "on-surface-variant": "#56423d",
                        "on-error": "#ffffff",
                        "inverse-surface": "#362f2b",
                        "on-primary-container": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0c2000",
                        "inverse-on-surface": "#fceee7",
                        "surface-container": "#f9ebe5",
                        "cat-breakfast": "#D98A2B",
                        "status-warning": "#E39A3B",
                        "secondary-fixed-dim": "#acd28a",
                        "on-tertiary-fixed-variant": "#7a2f16",

                        "cat-baby": "#D46A9F",

                        "on-tertiary": "#ffffff",
                        "status-good": "#5B8C51",
                        "surface-tint": "#9d4327",
                        "surface-bright": "#fff8f5",
                        "surface": "#fff8f5",
                        "border-soft": "#E5DBCB",
                        "tertiary-fixed-dim": "#ffb59e",
                        "cat-hygiene": "#3AA0A0",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "space-sm": "8px",
                        "space-md": "16px",
                        "unit": "4px",
                        "space-lg": "24px",
                        "space-xl": "32px",
                        "space-xs": "4px",
                        "space-touch": "48px",
                        "container-margin": "20px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],

                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }
    </script>
<style>
        .checklist-item.checked {
            opacity: 0.6;
            background-color: theme('colors.surface-container');
        }
        .checklist-item.checked .item-text {
            text-decoration: line-through;
            color: theme('colors.text-muted');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen relative pb-32">
<!-- TopAppBar from JSON -->
<header class="w-full top-0 sticky z-50 bg-background dark:bg-background border-b border-border-soft dark:border-outline-variant flat no shadows flex items-center justify-between px-container-margin py-space-sm">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-low transition-colors rounded-full p-2 active:opacity-80 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-inverse-primary font-bold tracking-tight">Warm Pantry</h1>
<div class="text-primary dark:text-inverse-primary flex items-center justify-center w-10 h-10 bg-surface-container-low rounded-full border border-border-soft">
<span class="material-symbols-outlined">person</span>
</div>
</header>
<main class="px-container-margin py-space-lg flex flex-col gap-space-xl max-w-2xl mx-auto">
<!-- Header Section -->
<section class="flex flex-col gap-space-sm">
<h2 class="font-display-lg text-display-lg text-on-surface">Packing 10 Boxes</h2>
<div class="bg-card-surface border border-border-soft rounded-xl p-space-md shadow-sm">
<p class="font-label-md text-label-md text-text-muted mb-space-xs uppercase tracking-wider">Blueprint per box</p>
<div class="flex flex-wrap gap-2 font-body-md text-body-md text-on-surface">
<span class="bg-cat-grain/10 text-cat-grain px-2 py-1 rounded-md font-semibold">2 Grains</span>
<span class="bg-cat-veg/10 text-cat-veg px-2 py-1 rounded-md font-semibold">2 Veggies</span>
<span class="bg-cat-protein/10 text-cat-protein px-2 py-1 rounded-md font-semibold">1 Protein</span>
<span class="bg-cat-breakfast/10 text-cat-breakfast px-2 py-1 rounded-md font-semibold">1 Breakfast</span>
</div>
</div>
</section>
<!-- Checklist Section -->
<section class="flex flex-col gap-space-lg">
<!-- Category: Protein -->
<div class="flex flex-col gap-space-sm">
<h3 class="font-headline-md text-headline-md text-cat-protein flex items-center gap-space-sm pb-space-xs border-b border-border-soft">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">set_meal</span>
                    Protein (1)
                </h3>
<label class="checklist-item flex items-center justify-between bg-card-surface border border-border-soft rounded-xl p-space-md min-h-[64px] cursor-pointer hover:bg-surface-container-low transition-colors active:scale-[0.98] shadow-sm select-none">
<div class="flex items-start gap-space-md w-full">
<input class="peer w-8 h-8 mt-1 rounded-md border-outline text-primary focus:ring-primary focus:ring-offset-background bg-background cursor-pointer" onchange="this.closest('.checklist-item').classList.toggle('checked', this.checked)" type="checkbox"/>
<div class="flex flex-col flex-grow">
<span class="item-text font-body-lg text-body-lg text-on-surface font-semibold transition-colors">Tuna Can (5 oz)</span>
<div class="flex items-center gap-1 mt-1">
<span class="inline-flex items-center gap-1 font-label-md text-label-md text-status-warning bg-status-warning/10 px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-[14px] font-bold">warning</span> Expiring Soon
                                </span>
</div>
</div>
</div>
</label>
</div>
<!-- Category: Veggies -->
<div class="flex flex-col gap-space-sm">
<h3 class="font-headline-md text-headline-md text-cat-veg flex items-center gap-space-sm pb-space-xs border-b border-border-soft">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">eco</span>
                    Veggies (2)
                </h3>
<label class="checklist-item flex items-center justify-between bg-card-surface border border-border-soft rounded-xl p-space-md min-h-[64px] cursor-pointer hover:bg-surface-container-low transition-colors active:scale-[0.98] shadow-sm select-none">
<div class="flex items-center gap-space-md w-full">
<input class="peer w-8 h-8 rounded-md border-outline text-primary focus:ring-primary focus:ring-offset-background bg-background cursor-pointer" onchange="this.closest('.checklist-item').classList.toggle('checked', this.checked)" type="checkbox"/>
<span class="item-text font-body-lg text-body-lg text-on-surface font-semibold transition-colors flex-grow">Canned Corn</span>
</div>
</label>
<label class="checklist-item flex items-center justify-between bg-card-surface border border-border-soft rounded-xl p-space-md min-h-[64px] cursor-pointer hover:bg-surface-container-low transition-colors active:scale-[0.98] shadow-sm select-none">
<div class="flex items-center gap-space-md w-full">
<input class="peer w-8 h-8 rounded-md border-outline text-primary focus:ring-primary focus:ring-offset-background bg-background cursor-pointer" onchange="this.closest('.checklist-item').classList.toggle('checked', this.checked)" type="checkbox"/>
<span class="item-text font-body-lg text-body-lg text-on-surface font-semibold transition-colors flex-grow">Green Beans</span>
</div>
</label>
</div>
<!-- Category: Grains -->
<div class="flex flex-col gap-space-sm">
<h3 class="font-headline-md text-headline-md text-cat-grain flex items-center gap-space-sm pb-space-xs border-b border-border-soft">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">agriculture</span>
                    Grains (2)
                </h3>
<label class="checklist-item flex items-center justify-between bg-card-surface border border-border-soft rounded-xl p-space-md min-h-[64px] cursor-pointer hover:bg-surface-container-low transition-colors active:scale-[0.98] shadow-sm select-none">
<div class="flex items-center gap-space-md w-full">
<input class="peer w-8 h-8 rounded-md border-outline text-primary focus:ring-primary focus:ring-offset-background bg-background cursor-pointer" onchange="this.closest('.checklist-item').classList.toggle('checked', this.checked)" type="checkbox"/>
<span class="item-text font-body-lg text-body-lg text-on-surface font-semibold transition-colors flex-grow">White Rice (1 lb bag)</span>
</div>
</label>
<label class="checklist-item flex items-center justify-between bg-card-surface border border-border-soft rounded-xl p-space-md min-h-[64px] cursor-pointer hover:bg-surface-container-low transition-colors active:scale-[0.98] shadow-sm select-none">
<div class="flex items-center gap-space-md w-full">
<input class="peer w-8 h-8 rounded-md border-outline text-primary focus:ring-primary focus:ring-offset-background bg-background cursor-pointer" onchange="this.closest('.checklist-item').classList.toggle('checked', this.checked)" type="checkbox"/>
<span class="item-text font-body-lg text-body-lg text-on-surface font-semibold transition-colors flex-grow">Spaghetti Pasta</span>
</div>
</label>
</div>
</section>
</main>
<!-- Bottom Action Bar (Contextual FAB replacement for task focus) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-border-soft p-container-margin z-50 pb-safe shadow-[0_-8px_16px_rgba(156,66,38,0.05)]">
<div class="max-w-2xl mx-auto">
<button class="w-full bg-tertiary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl flex items-center justify-center gap-space-sm active:opacity-80 transition-opacity min-h-[64px] shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
                Mark Box Complete
            </button>
</div>
</div>
</body></html>
