<style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

<body class="bg-background min-h-screen flex items-center justify-center p-container-margin antialiased">
<!-- Main Form Container -->
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Hero/Branding Area -->
<div class="mb-space-xl flex flex-col items-center w-full">
<div class="w-24 h-24 mb-space-md rounded-full overflow-hidden border-4 border-surface-container shadow-sm flex-shrink-0">
<img alt="Warm Pantry" class="w-full h-full object-cover" data-alt="A macro photography shot of fresh, warmly lit oranges and rustic bread in a woven basket sitting on a wooden table, emphasizing community, warmth, and nourishment in a bright, modern, and inviting setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPlbZFMuFhVn3CU7wnbrS_mbQ1ElW_zyHG2oj1__xLKIafQpTfXhYO6GGw0k33FFPFwZuHNEdqNHZywUjkoRFqoQmHtwFD01nVNkc2fLswB-qa-jZQP0DKY3Nu3buSJuTTQ3ObO5gsli49DuYZOLp6NKNDf67QnuLrgWrMnnTpj8zqwCu2Fu7IA-YiuLZ1rIO9zigQfSXxjBGCwcAXhvclUMRd_VJddLdUrgX1fHd6ov8RRDzchD0DWw"/>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center tracking-tight mb-space-xs">
                PantryLens
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">
                Empowering volunteers to sort, inventory, and build with care.
            </p>
</div>
<!-- Login Card -->
<div class="w-full bg-card-surface border border-border-soft rounded-xl shadow-sm p-space-lg flex flex-col gap-space-lg relative overflow-hidden">
<!-- Subtle decorative top bar -->
<div class="absolute top-0 left-0 w-full h-[4px] bg-primary-container"></div>
<form class="flex flex-col gap-space-lg w-full mt-space-sm" onsubmit="event.preventDefault();">
<!-- Pantry ID Input Group -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="pantry-id">Pantry Login ID</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-space-md top-1/2 -translate-y-1/2 text-outline">
                            badge
                        </span>
<input class="w-full h-space-touch rounded-lg border border-outline-variant bg-surface-container-lowest pl-12 pr-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="pantry-id" placeholder="e.g. WP-1024" type="text"/>
</div>
</div>
<!-- Access Code Input Group -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center w-full">
<label class="font-label-md text-label-md text-on-surface" for="access-code">Access Code</label>
</div>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-space-md top-1/2 -translate-y-1/2 text-outline">
                            lock
                        </span>
<input class="w-full h-space-touch rounded-lg border border-outline-variant bg-surface-container-lowest pl-12 pr-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="access-code" placeholder="Enter your 6-digit pin" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-space-touch bg-primary hover:bg-tertiary-container text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-sm active:translate-y-[1px] transition-all mt-space-xs" type="submit">
                    Enter
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Actions -->
<div class="mt-space-lg flex flex-col items-center gap-space-sm">
<button class="font-body-md text-body-md text-primary font-semibold hover:underline bg-transparent border-none cursor-pointer">
                Scan Location QR Code
            </button>
</div>
</main>
</body></html>
