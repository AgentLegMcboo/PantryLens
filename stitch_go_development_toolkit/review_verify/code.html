<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-border-soft p-container-margin pb-safe shadow-[0_-4px_12px_rgba(156,66,38,0.05)] z-50">
<div class="max-w-3xl mx-auto flex gap-4">

                Cancel
            </button>
<button class="flex-1 h-[56px] rounded-full bg-tertiary-container text-on-primary font-headline-md text-headline-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center shadow-md">
                Add to Inventory (5)
            </button>
</div>

<script>
        // Simple micro-interaction for checkboxes to slightly style the card when confirmed
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const card = e.target.closest('.rounded-xl');
                if (card) {
                    if (e.target.checked) {
                        // Assuming checked means confirmed, maybe lower opacity slightly or add a subtle green tint
                        card.style.opacity = '1';
                        // if it was a warning card, maybe remove the heavy warning styling visually
                        if(card.classList.contains('border-status-warning/30')) {
                           card.classList.replace('border-status-warning/30', 'border-border-soft');
                           card.style.backgroundColor = '#FEFBF6'; // back to card-surface
                           let strip = card.querySelector('.bg-status-warning');
                           if(strip) strip.classList.replace('bg-status-warning', 'bg-status-good');
                        }
                    } else {
                        card.style.opacity = '0.9';
                    }
                }
            });
        });
    </script>
