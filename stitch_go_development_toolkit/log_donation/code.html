<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for horizontal queue */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-background text-on-background antialiased h-screen flex flex-col overflow-hidden">
<!-- Task Header (Suppresses Global Nav due to focus) -->
<header class="flex items-center justify-between px-container-margin py-space-sm w-full bg-surface-container-lowest z-20">
<button class="h-space-touch w-space-touch flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant -ml-4">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background">Log Donation</h1>
<button class="h-space-touch w-space-touch flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant -mr-4">
<span class="material-symbols-outlined">help</span>
</button>
</header>
<!-- Camera Viewport Area -->
<main class="flex-1 relative flex flex-col bg-surface-container-highest overflow-hidden">
<!-- Live Camera Feed Simulation -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-90" data-alt="A smartphone point-of-view looking down into a large reusable shopping bag filled with pantry donations. Visible items include canned soup, dried pasta boxes, and a plastic jar of peanut butter. The lighting is warm and slightly diffused, typical of a pantry sorting room, with the items sharply in focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCh9xpvrZLVplPbCxsbyJZEFzwPw929HEPSLefNnGrdH5NyvYX8xNaVdnRZTKqxFvF7sXlcWkIjXu-1Bp4Lflyt1FvxzJfZhEdXjsNWPqDXMMR40oqaGw8tqq9I5sQHg58fDHq3mMDwpSmfIjOeehzUT__hEt5kFkba5VEVReuyqVGyqUZWMz0dKgdLjh_mSnyZSbX2HAY6V9W-z3ZAO8G3EvqhPAbZ85PGfYDGu6hhMj72SDYinDlvHg"/>
<!-- Vignette for better UI contrast -->
<div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/40 pointer-events-none"></div>
</div>
<!-- Scanning UI Overlay -->
<div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-center items-center px-container-margin">
<!-- Reticle -->
<div class="w-full max-w-[280px] aspect-[4/5] border-2 border-primary/40 rounded-xl relative">
<!-- Corner Targets -->
<div class="absolute -top-[2px] -left-[2px] w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
<div class="absolute -top-[2px] -right-[2px] w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
<div class="absolute -bottom-[2px] -left-[2px] w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
<div class="absolute -bottom-[2px] -right-[2px] w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
<!-- Scanning Line Animation -->
<div class="absolute left-0 right-0 h-[2px] bg-primary top-1/4 shadow-[0_0_8px_rgba(156,66,38,0.8)] opacity-60"></div>
</div>
</div>
<!-- Guidance Overlay Top -->
<div class="absolute top-space-lg left-0 w-full flex justify-center z-20 px-container-margin">
<div class="bg-inverse-surface/85 backdrop-blur-sm text-inverse-on-surface py-space-sm px-space-lg rounded-full font-label-md text-label-md shadow-md flex items-center gap-space-xs text-center border border-white/10">
                Take a photo of the donation bag
            </div>
</div>
<!-- Spacer to push controls down -->
<div class="flex-1 z-10"></div>
<!-- Camera Controls -->
<div class="relative z-20 flex flex-col items-center pb-space-lg pt-space-xl">
<!-- Shutter Button -->
<button class="w-[72px] h-[72px] rounded-full border-[3px] border-white/80 p-1 flex items-center justify-center active:scale-95 transition-transform bg-black/20 backdrop-blur-sm shadow-lg mb-space-md">
<div class="w-full h-full rounded-full bg-primary hover:bg-primary-container transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</button>
<!-- Secondary Guidance -->
<div class="bg-surface-container-highest/90 backdrop-blur-md px-space-md py-space-sm rounded-lg border border-border-soft/50 flex items-center gap-space-sm mx-container-margin shadow-sm max-w-sm">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">zoom_in</span>
<p class="font-body-md text-[13px] leading-tight text-on-surface-variant">
                    Add close-ups of labels or expiration dates if they are hard to read.
                </p>
</div>
</div>
</main>
<!-- Bottom Action Area (Queue & Detect) -->
<div class="bg-card-surface border-t border-border-soft pb-safe z-30 shadow-[0_-8px_16px_rgba(217,138,43,0.06)] rounded-t-2xl relative -mt-4">
<div class="p-container-margin flex flex-col gap-space-md">
<!-- Upload Queue -->
<div class="flex items-center gap-space-sm overflow-x-auto no-scrollbar snap-x pb-unit">
<!-- Add More Trigger (acts as queue start) -->
<button class="flex-shrink-0 w-16 h-16 rounded-lg border-2 border-dashed border-primary bg-primary-container/10 text-primary flex flex-col items-center justify-center hover:bg-primary-container/20 transition-colors snap-start">
<span class="material-symbols-outlined mb-1">add</span>
<span class="font-label-md text-[10px]">Add Photo</span>
</button>
<!-- Captured Thumbnail 1 -->
<div class="relative flex-shrink-0 w-16 h-16 rounded-lg border border-border-soft overflow-hidden snap-start shadow-sm bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A close-up photograph of a can of diced tomatoes, clearly showing the brand label and the printed expiration date 'EXP 12/2025' on the metal lid. The lighting is bright and tactical, emphasizing the text for optical character recognition." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJtE8FJyv0MMaITHAZnv91qqjqLgstsuRKkBiAWGJAud58MIGwHgvwENnQllmOQgaS4ddrpETc38Oatfr6ctlyAjli-LQRhouFVAK3ENwg6nAG7Erzf00IodFqHz4EvC3Sprrsx8YaOTSuxl9jZpWxfOqseOOm1xN5bRvTp30K5URmbj5uueSIaPQm_MU_SBxtFmEY7kEfpZqg_n7nTpLO3g5zjwJCCJ9LDSNEvfsWOgXnhjtWjtRs0w"/>
<!-- Remove overlay button -->
<button class="absolute -top-1 -right-1 bg-inverse-surface/80 text-inverse-on-surface rounded-full w-5 h-5 flex items-center justify-center backdrop-blur-sm border border-card-surface">
<span class="material-symbols-outlined text-[12px]">close</span>
</button>
<!-- Success indicator -->
<div class="absolute bottom-1 right-1 bg-status-good rounded-full w-3 h-3 border border-white flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[8px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Captured Thumbnail 2 -->
<div class="relative flex-shrink-0 w-16 h-16 rounded-lg border border-border-soft overflow-hidden snap-start shadow-sm bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A macro shot focusing on the nutritional label side of a cereal box. The text is crisp and legible against the warm, slightly shadowed background of a busy pantry sorting table." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBbKr5FYDNFgEmmPhVYKwugjrso6eiXzrQPRxTRw282R4ugooELaF0QvZ3GpCIg7zCG9_6MXsv7b4vgF7KStT5UDOwgd7umtgUo2KxejRYLpTkTTgMSkUF5_piYvvSYSXhkwCjGfsDm1eBKGPRfrtxVX7qec2j8WSCU441QTs7FSPYY0EZOPadpGYttPb9bK0Pp0IgPpFjuuARk53u7W8H44TBBaOClFpRo38ld1GMSf0RZbgxOPv7qhw"/>
<button class="absolute -top-1 -right-1 bg-inverse-surface/80 text-inverse-on-surface rounded-full w-5 h-5 flex items-center justify-center backdrop-blur-sm border border-card-surface">
<span class="material-symbols-outlined text-[12px]">close</span>
</button>
<div class="absolute bottom-1 right-1 bg-status-good rounded-full w-3 h-3 border border-white flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[8px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Spacer for scrolling comfort -->
<div class="flex-shrink-0 w-4 h-16"></div>
</div>
<!-- Primary Action -->
<button class="w-full h-space-touch bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md active:scale-[0.98] transition-transform hover:bg-surface-tint">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
                Detect Items
            </button>
</div>
</div>
</body></html>
