<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Item Detail - Warm Pantry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#b85d40",
                        "on-surface": "#211a16",
                        "on-background": "#211a16",
                        "cat-snack": "#8E6FC4",

                        "on-primary-fixed-variant": "#7e2c12",

                        "surface-variant": "#ede0d9",
                        "cat-veg": "#5B9C4E",
                        "primary-container": "#bc5a3c",
                        "status-critical": "#C0392B",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#3a0a00",
                        "card-surface": "#FEFBF6",
                        "outline-variant": "#dcc1b9",
                        "surface-dim": "#e5d7d1",
                        "secondary-container": "#c7efa4",
                        "outline": "#89726c",
                        "text-muted": "#6B6259",
                        "secondary-fixed": "#c7efa4",
                        "cat-grain": "#C9A227",
                        "on-tertiary-container": "#110100",
                        "background": "#fff8f5",
                        "surface-container-high": "#f3e5df",
                        "on-primary-fixed": "#3a0a00",
                        "cat-unknown": "#8A8880",
                        "inverse-primary": "#ffb59f",
                        "primary": "#9c4226",
                        "tertiary": "#99452b",
                        "surface-container-low": "#fff1ea",
                        "on-surface-variant": "#56423d",
                        "on-error": "#ffffff",
                        "inverse-surface": "#362f2b",
                        "on-primary-container": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0c2000",
                        "inverse-on-surface": "#fceee7",
                        "surface-container": "#f9ebe5",
                        "cat-breakfast": "#D98A2B",
                        "status-warning": "#E39A3B",
                        "secondary-fixed-dim": "#acd28a",
                        "on-tertiary-fixed-variant": "#7a2f16",
                        "on-secondary-fixed-variant": "#304f16",
                        "primary-fixed": "#ffdbd1",
                        "tertiary-fixed": "#ffdbd0",
                        "secondary": "#47672c",
                        "primary-fixed-dim": "#ffb59f",
                        "on-primary": "#ffffff",
                        "cat-baby": "#D46A9F",
                        "cat-protein": "#A6432B",
                        "on-tertiary": "#ffffff",
                        "status-good": "#5B8C51",
                        "surface-tint": "#9d4327",
                        "surface-bright": "#fff8f5",
                        "surface": "#fff8f5",
                        "border-soft": "#E5DBCB",
                        "tertiary-fixed-dim": "#ffb59e",
                        "cat-hygiene": "#3AA0A0",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "space-sm": "8px",
                        "space-md": "16px",
                        "unit": "4px",
                        "space-lg": "24px",
                        "space-xl": "32px",
                        "space-xs": "4px",
                        "space-touch": "48px",
                        "container-margin": "20px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #FBF6EE; /* Cream Level 0 */
            color: #211a16;
        }
        .card {
            background-color: #FEFBF6; /* Off-white Level 1 */
            border: 1px solid #E5DBCB; /* Soft Tan border */
        }
    </style>
</head>
<body class="font-body-md min-h-screen pb-safe">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background w-full top-0 sticky border-b border-border-soft dark:border-outline-variant z-50">
<div class="flex items-center justify-between px-container-margin py-space-sm w-full">
<button aria-label="Go back" class="text-primary dark:text-inverse-primary hover:bg-surface-container-low transition-colors rounded-full p-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-inverse-primary font-bold">Item Details</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="px-container-margin py-space-lg max-w-2xl mx-auto space-y-space-lg">
<!-- Item Form Card -->
<div class="card rounded-xl p-space-md shadow-sm">
<!-- Image Area (Optional but adds tactile feel) -->
<div class="w-full h-48 bg-surface-container-high rounded-lg mb-space-md flex items-center justify-center overflow-hidden border border-border-soft relative">
<div class="bg-cover bg-center w-full h-full absolute inset-0 opacity-80" data-alt="A close up, high quality photo of a can of green beans sitting on a rustic wooden pantry shelf. The lighting is warm and natural, emphasizing the utilitarian, cozy kitchen aesthetic of the app. The colors are dominated by the green of the can label and the soft tans and browns of the shelf." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAp0RjPMF89uNSFifRumHr9RNtnjvhd9jrDcBziPXGQo9T7-r2h8TyfXrne45zuCuQnZAUT57-82Nsg061YErWXXAmNb6h81g5_ELSCg6nD8CXBajsoC48eQfoNUrQ3kk-e7Gc9IVc9TcntCxH5zZaUZ04kv0bSgeMt3hQ-DSWjZLHh53LBsmR6UcMbsXK1oepwc-QibbU9EQ6pUexpSJ5Wmy_AgBbReuCZlPaqlpYSkaVi_IuSRvEZ6g')"></div>
<div class="absolute bottom-2 right-2 bg-card-surface px-3 py-1 rounded-full border border-border-soft flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-status-good"></span>
<span class="font-label-md text-label-md text-on-surface">Verified</span>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-space-md">
<!-- Name -->
<div>
<label class="block font-label-md text-label-md text-text-muted mb-space-xs" for="item_name">Item Name</label>
<input class="w-full h-space-touch px-space-md border border-border-soft rounded-lg bg-surface-container-lowest text-on-surface font-body-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="item_name" type="text" value="Canned Green Beans"/>
</div>
<!-- Category -->
<div>
<label class="block font-label-md text-label-md text-text-muted mb-space-xs" for="category">Category</label>
<div class="relative">
<select class="w-full h-space-touch px-space-md border border-border-soft rounded-lg bg-surface-container-lowest text-on-surface font-body-lg appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="category">
<option selected="" value="veg">Vegetables</option>
<option value="protein">Protein</option>
<option value="grains">Grains</option>
<option value="fruit">Fruit</option>
</select>
<span class="material-symbols-outlined absolute right-space-md top-1/2 -translate-y-1/2 text-text-muted pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Count & Expiration (Row on larger screens, stacked on mobile) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
<!-- Count Stepper -->
<div>
<label class="block font-label-md text-label-md text-text-muted mb-space-xs">Quantity</label>
<div class="flex items-center justify-between border border-border-soft rounded-lg bg-surface-container-lowest h-space-touch overflow-hidden">
<button aria-label="Decrease quantity" class="w-12 h-full flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<span class="font-headline-md text-headline-md text-on-surface">24</span>
<button aria-label="Increase quantity" class="w-12 h-full flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Expiration Date -->
<div>
<label class="block font-label-md text-label-md text-text-muted mb-space-xs" for="expiration">Expiration Date</label>
<div class="relative">
<input class="w-full h-space-touch px-space-md border border-border-soft rounded-lg bg-surface-container-lowest text-on-surface font-body-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="expiration" type="date" value="2025-10-15"/>
</div>
</div>
</div>
</div>
</div>
<!-- History Section -->
<div class="card rounded-xl p-space-md shadow-sm">
<h3 class="font-headline-md text-headline-md text-on-surface mb-space-md">Item History</h3>
<div class="space-y-space-sm relative before:absolute before:inset-y-0 before:left-[11px] before:w-px before:bg-border-soft">
<!-- History Item 1 -->
<div class="flex gap-space-md relative">
<div class="w-6 h-6 rounded-full bg-surface-container-low border-2 border-primary flex items-center justify-center z-10 shrink-0 mt-1">
<span class="w-2 h-2 rounded-full bg-primary"></span>
</div>
<div>
<p class="font-body-md text-on-surface">Updated quantity to 24</p>
<p class="font-label-md text-label-md text-text-muted mt-1">Today, 9:42 AM by Sarah V.</p>
</div>
</div>
<!-- History Item 2 -->
<div class="flex gap-space-md relative">
<div class="w-6 h-6 rounded-full bg-surface-container-low border-2 border-border-soft flex items-center justify-center z-10 shrink-0 mt-1">
</div>
<div>
<p class="font-body-md text-on-surface">Added via Smart Scan</p>
<p class="font-label-md text-label-md text-text-muted mt-1">Oct 12, 2023, 2:15 PM by System</p>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="space-y-space-md pb-space-xl">
<button class="w-full h-space-touch bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:opacity-90 transition-opacity active:scale-[0.98] shadow-sm">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Save Changes
            </button>
<button class="w-full h-space-touch border border-status-critical text-status-critical font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:bg-error-container/20 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
                Delete Item
            </button>
</div>
</main>
</body></html>
